name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: keikkone
          POSTGRES_PASSWORD: keikkone
          POSTGRES_DB: keikkone_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U keikkone"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The e2e suite reads .env.test (git-ignored), so CI writes its own.
      - name: Write .env.test
        run: |
          cat > .env.test <<'ENV'
          NODE_ENV=test
          DATABASE_URL=postgresql://keikkone:keikkone@localhost:5432/keikkone_test?schema=public
          JWT_ACCESS_SECRET=ci-only-secret-that-is-at-least-32-characters
          ENV

      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
