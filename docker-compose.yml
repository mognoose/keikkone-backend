services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: keikkone
      POSTGRES_PASSWORD: keikkone
      POSTGRES_DB: keikkone
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate e2e test database on first start
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keikkone']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
