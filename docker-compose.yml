services:
  db:
    # Same major version as the Neon production database
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: keikkone
      POSTGRES_PASSWORD: keikkone
      POSTGRES_DB: keikkone
    ports:
      - '5433:5432'
    volumes:
      # Postgres 18 images keep data in a versioned subfolder (18/docker), so
      # the volume mounts the parent; the old /data path makes 18 refuse to start.
      - pgdata:/var/lib/postgresql
      # Creates the separate e2e test database on first start
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keikkone']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
